; ============================================================
;  DeskBot-S3 —— ESP32-S3-DevKitC-1 N16R8 桌面机器人
;  逻辑层可在电脑上跑 Unity 单元测试，硬件层只做适配
; ============================================================
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600          ; 上传失败时改成 460800 或 115200

; N16R8 = 16MB Quad Flash + 8MB Octal PSRAM
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc

build_src_filter = +<*> -<module_test.cpp>

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.1
    arduino-libraries/Servo@^1.2.1

; 模块测试固件：pio run -e module_test -t upload
[env:module_test]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc
; 测试固件不带 Wi-Fi/WebServer 与网页动作，省内存也避免误开热点
build_src_filter = +<*> -<main.cpp> -<hw/webui.cpp> -<hw/action_player.cpp>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.1
    arduino-libraries/Servo@^1.2.1

; 只跑电脑上的单元测试：pio test -e native
; pio run -e native 仅做“能编能链”的自检，入口由 src/native/stub_main.cpp
; 提供（PIO_UNIT_TESTING 时不编译，测试用 Unity 自带的 main）
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<logic/> +<native/>
build_flags =
    -std=gnu++11
    -Isrc
    -mconsole